name: Release

# Publishes lenz-io to PyPI via OIDC trusted publisher.
# Trigger: push a tag like `v1.0.0rc1` (or `v1.0.0`, etc.).
# Required PyPI setup: https://pypi.org/help/#trusted-publishers
#   Owner: lenzhq, Repo: lenz-io-python, Workflow: release.yml, Env: pypi

on:
  push:
    tags:
      - "v*"

# Least privilege, overridden per job below only where more is needed:
# `publish` adds `id-token: write` for PyPI's OIDC trusted-publisher flow,
# `notify` needs nothing (it only posts to a Discord webhook).
permissions:
  contents: read

jobs:
  smoke:
    # The live API smoke (smoke.yml). `publish` needs it, so a failed or
    # keyless smoke run stops the release.
    uses: ./.github/workflows/smoke.yml
    secrets: inherit

  publish:
    name: publish to PyPI
    needs: smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lenz-io/
    permissions:
      # Job-level permissions replace the workflow default entirely, so
      # `contents: read` has to be restated here for `actions/checkout`.
      contents: read
      id-token: write # PyPI's OIDC trusted-publisher exchange.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (OIDC trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1

  notify:
    name: discord notify
    # Only runs when `publish` succeeded (default needs-gating), so this fires
    # exactly on a successful PyPI publish.
    needs: publish
    runs-on: ubuntu-latest
    # No checkout, no repo access — this job only posts to a Discord webhook.
    permissions: {}
    steps:
      - name: Post to Discord #key-system-events
        env:
          # Webhook bound to the #key-system-events channel — set as a repo secret.
          # Separate from DISCORD_WEBHOOK_URL (#alerts) so a successful publish
          # is a release/system-lifecycle event, not an incident.
          WEBHOOK: ${{ secrets.KEY_SYSTEM_EVENTS_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No KEY_SYSTEM_EVENTS_WEBHOOK_URL secret; skipping."; exit 0; fi
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sS -H "Content-Type: application/json" -X POST "$WEBHOOK" \
            -d "{\"content\": \"🟢 \`lenz-io ${VERSION}\` published to PyPI — https://pypi.org/project/lenz-io/${VERSION}/\"}"
